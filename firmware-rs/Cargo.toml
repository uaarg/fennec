[package]
name = "fennec-fw"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
critical-section = "1.2.0"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32f407vg", "memory-x", "time-driver-tim2", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"], optional = true }

[features]
default = ["hardware"]
hardware = ["dep:panic-probe"]
# Renode builds: plain-text logs and panics on USART2. Never flash to hardware.
emulation = []

[profile.dev]
opt-level = 1
debug = 2

[profile.release]
opt-level = "s"
debug = 2
lto = "fat"
codegen-units = 1
